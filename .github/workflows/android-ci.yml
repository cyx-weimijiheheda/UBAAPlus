name: Android CI

# 键盘为 "on" 时必须加引号：部分 YAML 解析器会把它当成布尔值，导致编辑器误报错误。
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # runner 镜像自带 Android SDK，直接用其中的 sdkmanager 装包。
      # 不用 android-actions/setup-android：它固定执行 `sdkmanager tools`，
      # 而新版 SDK 仓库已不再发布 tools 包，会直接失败。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER" || { echo "找不到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Client unit tests
        run: ./gradlew :core:test :shared:testDebugUnitTest

      - name: Server tests
        run: ./gradlew :server:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ubaa-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 生成 universal / x86 / arm64-v8a 三个 release APK。
  # 未配置正式签名时 Gradle 会退回 debug 签名，保证产物可安装。
  build-release:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          test -n "$SDKMANAGER" || { echo "找不到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "缺少 RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "缺少 RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "缺少 RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ubaaplus-release.jks"

      - name: Assemble release APKs
        env:
          SIGNING_KEY: ${{ runner.temp }}/ubaaplus-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PabiSplits=true

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: ubaaplus-release-apks
          path: androidApp/build/outputs/apk/release-renamed/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # 重新构建同一版本时先清空旧产物，避免残留旧文件名。
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
            gh release upload "$GITHUB_REF_NAME" androidApp/build/outputs/apk/release-renamed/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "UBAAPlus $GITHUB_REF_NAME" \
              --generate-notes \
              androidApp/build/outputs/apk/release-renamed/*.apk
          fi
